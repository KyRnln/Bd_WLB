<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商务WLB插件</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/utilities.css">
  <link rel="stylesheet" href="styles/modules.css">
</head>
<body class="bg-fluent-bg text-fluent-text min-h-screen p-2 sm:p-3 antialiased">
  <main class="max-w-md mx-auto space-y-2">
    <!-- BEGIN: Creator Management Section -->
    <section id="creatorCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-3 backdrop-blur-md shadow-lg">
      <div id="creatorCardStatus" class="status info" style="display:none;"></div>
      <!-- Header Area -->
      <div class="space-y-1 mb-3">
        <div class="space-y-1 mb-3">
          <h2 class="text-base font-semibold">达人管理</h2>
          <p class="text-xs text-fluent-textMuted leading-tight">通过飞书导入达人ID，页面会自动匹配并高亮达人</p>
        </div>
      </div>
      <!-- Action Button + Stats Row -->
      <div class="flex items-center gap-2 mb-3">
        <div class="creator-stats-row" id="creatorStatsRow" style="margin-bottom: 0; flex: 1; min-width: 0; gap: 4px;">
          <div class="fluent-card stat-card" style="padding: 4px; min-height: auto; flex-direction: column; gap: 0;">
            <div style="display: flex; align-items: center; gap: 2px;">
              <p class="stat-card-label" style="font-size: 10px; line-height: 14px; margin-bottom: 0;">总计</p>
            </div>
            <p class="stat-card-value" id="popupTotalCount" style="font-size: 11px; line-height: 14px; text-align: center;">0</p>
          </div>
          <div class="fluent-card stat-card" style="padding: 4px; min-height: auto; flex-direction: column; gap: 0;">
            <div style="display: flex; align-items: center; gap: 2px;">
              <p class="stat-card-label" style="font-size: 10px; line-height: 14px; margin-bottom: 0;">绩效</p>
            </div>
            <p class="stat-card-value" id="popupPerfCount" style="font-size: 11px; line-height: 14px; text-align: center;">0</p>
          </div>
          <div class="fluent-card stat-card" style="padding: 4px; min-height: auto; flex-direction: column; gap: 0;">
            <div style="display: flex; align-items: center; gap: 2px;">
              <p class="stat-card-label" style="font-size: 10px; line-height: 14px; margin-bottom: 0;">复联</p>
            </div>
            <p class="stat-card-value" id="popupReconnectCount" style="font-size: 11px; line-height: 14px; text-align: center;">0</p>
          </div>
          <div class="fluent-card stat-card" style="padding: 4px; min-height: auto; flex-direction: column; gap: 0;">
            <div style="display: flex; align-items: center; gap: 2px;">
              <p class="stat-card-label" style="font-size: 10px; line-height: 14px; margin-bottom: 0;">流失</p>
            </div>
            <p class="stat-card-value" id="popupLostCount" style="font-size: 11px; line-height: 14px; text-align: center;">0</p>
          </div>
        </div>
      </div>
      <!-- Search Input -->
      <div class="mb-3 flex gap-2">
        <input id="creatorSearchInput" type="text" class="flex-1 bg-fluent-input border-t-0 border-l-0 border-r-0 border-b border-fluent-inputBorder rounded-md px-3 py-2 text-sm text-fluent-text placeholder-fluent-textMuted fluent-input transition-all duration-200" placeholder="通过达人ID，CID，地区搜索..."/>
        <button id="openCreatorManageBtn" class="px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200 whitespace-nowrap">
          达人管理
        </button>
      </div>
      <div id="creatorPreview"></div>
      <div id="creatorSearchResults" class="search-results">
        <div id="searchResultLabel" class="text-sm text-fluent-textMuted mb-2" style="display:none;">搜索结果：</div>
        <div id="creatorSearchList" class="search-list"></div>
      </div>
    </section>
    <!-- END: Creator Management Section -->

    <!-- BEGIN: Function Selection Section -->
    <section id="toolsCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-3 backdrop-blur-md shadow-lg">
      <div class="flex items-baseline gap-2 mb-2">
        <h3 class="text-sm font-semibold">功能工具</h3>
      </div>
      <div class="grid grid-cols-2 gap-2 w-full">
        <button id="btnSampleCrawl" class="flex items-center justify-center gap-2 px-3 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200">
          样品申请采集
        </button>
        <button id="btnOrder" class="flex items-center justify-center gap-2 px-3 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200">
          订单履约情况
        </button>
        <button id="btnBitableCover" class="flex items-center justify-center gap-2 px-3 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200">
          封面获取(多维)
        </button>
      </div>
    </section>
    <!-- END: Function Selection Section -->

    <!-- BEGIN: AI Translation Section -->
    <section id="translateCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-3 backdrop-blur-md shadow-lg">
      <div class="flex items-baseline gap-2 mb-2">
        <h3 class="text-sm font-semibold">AI翻译</h3>
        <span id="translateShortcutHint" class="text-xs text-fluent-textMuted">Alt+Q 触发</span>
        <span id="translateModelInfo" class="text-xs text-fluent-textMuted">未配置</span>
      </div>
      <div class="flex gap-2 w-full">
        <button id="btnTranslateNow" class="flex-1 flex items-center justify-center gap-2 px-3 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200">
          即时翻译
        </button>
        <button id="btnTranslate" class="flex-1 flex items-center justify-center gap-2 px-3 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200">
          翻译配置
        </button>
      </div>
    </section>
    <!-- END: AI Translation Section -->

    <!-- BEGIN: Phrase Management Section -->
    <section id="phraseCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-3 backdrop-blur-md shadow-lg">
      <div id="phraseCardStatus" class="status info" style="display:none;"></div>
      <div class="flex items-baseline gap-2 mb-2">
        <h3 class="text-sm font-semibold">短语管理</h3>
        <span id="phraseShortcutHint" class="text-xs text-fluent-textMuted">快捷短语输入"/"触发</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin: 4px 0;">
        <div id="tagBar" class="creator-filters" style="margin: 0; flex: 1; border-bottom: none;"></div>
      </div>
      <div id="phraseList" style="display:none;"></div>
    </section>
    <!-- END: Phrase Management Section -->



    <!-- BEGIN: Data Management Section -->
    <section id="dataCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-3 backdrop-blur-md shadow-lg">
      <div id="dataCardStatus" class="status info" style="display:none;"></div>
      <div class="flex items-baseline gap-2 mb-2">
        <h3 class="text-sm font-semibold">数据管理</h3>
        <span class="text-xs text-fluent-textMuted">备份与恢复数据</span>
      </div>
      <button id="btnBackup" class="px-3 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-all duration-200">
        数据备份
      </button>
    </section>
    <!-- END: Data Management Section -->
  </main>

  <div id="phraseEditDialog" class="dialog-mask">
    <div class="dialog">
      <h3 id="phraseEditTitle">添加短语</h3>
      <label for="phraseTag">标签（必选）</label>
      <select id="phraseTag"></select>
      <label for="phraseTitle">标题</label>
      <input id="phraseTitle" type="text" placeholder="例如：常用回复"/>
      <label for="phraseContent">内容</label>
      <textarea id="phraseContent" placeholder="输入要插入的文本"></textarea>
      <div class="footer">
        <button id="cancelPhraseBtn" class="btn-sm">取消</button>
        <button id="savePhraseBtn" class="btn-sm btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="creatorEditDialog" class="dialog-mask">
    <div class="dialog">
      <h3>编辑达人信息</h3>
      <label for="creatorEditId">达人ID</label>
      <input id="creatorEditId" type="text" readonly/>
      <label for="creatorEditCid">达人CID（选填）</label>
      <input id="creatorEditCid" type="text" placeholder="输入达人CID"/>
      <label for="creatorEditRegion">地区代码（选填）</label>
      <input id="creatorEditRegion" type="text" placeholder="例如：MY/TH/ID/SG/PH/VN"/>
      <label for="creatorEditTag">标签（选填）</label>
      <input id="creatorEditTag" type="text" placeholder="例如：绩效达人、流失达人、隐藏达人"/>
      <label for="creatorEditRemark">备注信息（选填）</label>
      <textarea id="creatorEditRemark" placeholder="输入达人的备注信息" style="min-height: 60px;"></textarea>
      <div class="footer">
        <button id="cancelCreatorEditBtn" class="btn-sm">取消</button>
        <button id="saveCreatorEditBtn" class="btn-sm btn-primary">保存</button>
        <button id="deleteCreatorBtn" class="btn-sm btn-danger">删除</button>
      </div>
    </div>
  </div>

  <script src="libs/exceljs.min.js"></script>
  <script src="styles/auto-squircle.js"></script>
  <script src="phrase/phrase.js"></script>
  <script src="creator/creator.js"></script>
  <script src="popup.js"></script>

  <div class="footer-text">
    Powered by "电子恐龙" with AI
  </div>
</body>
</html>
