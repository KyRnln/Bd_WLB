<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商务WLB插件</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/utilities.css">
  <link rel="stylesheet" href="styles/modules.css">
</head>
<body class="bg-fluent-bg text-fluent-text min-h-screen p-4 sm:p-6 antialiased">
  <main class="max-w-md mx-auto space-y-4">
    <!-- BEGIN: Creator Management Section -->
    <section id="creatorCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-4 backdrop-blur-md shadow-lg">
      <div id="creatorCardStatus" class="status info" style="display:none;"></div>
      <!-- Header Area -->
      <div class="space-y-1 mb-4">
        <div class="space-y-1 mb-4">
          <h2 class="text-base font-semibold">达人管理</h2>
          <p class="text-xs text-fluent-textMuted leading-tight">通过 XLSX 导入达人ID，页面会自动匹配并高亮达人</p>
        </div>
      </div>
      <!-- Action Button + Stats Row -->
      <div class="flex items-center gap-2 mb-4">
        <div class="creator-stats-row" id="creatorStatsRow" style="margin-bottom: 0; flex: 1; min-width: 0;">
          <div class="fluent-card stat-card" style="padding: 4px 6px; min-height: 34px;">
            <div class="stat-icon" style="width: 16px; height: 16px; border-radius: 4px;">
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
            </div>
            <div>
              <p class="stat-card-label" style="font-size: 9px; line-height: 12px; margin-bottom: 0;">总计</p>
              <p class="stat-card-value" id="popupTotalCount" style="font-size: 13px; line-height: 16px;">0</p>
            </div>
          </div>
          <div class="fluent-card stat-card" style="padding: 4px 6px; min-height: 34px;">
             <div class="stat-icon" style="width: 16px; height: 16px; border-radius: 4px;">
               <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6L9 12.75l4.286-4.286a11.948 11.948 0 014.306 6.43l.776 2.898m0 0l3.182-5.511m-3.182 5.51l-5.511-3.181" /></svg>
             </div>
            <div>
              <p class="stat-card-label" style="font-size: 9px; line-height: 12px; margin-bottom: 0;">流失</p>
              <p class="stat-card-value" id="popupLostCount" style="font-size: 13px; line-height: 16px;">0</p>
            </div>
          </div>
          <div class="fluent-card stat-card" style="padding: 4px 6px; min-height: 34px;">
            <div class="stat-icon" style="width: 16px; height: 16px; border-radius: 4px;">
              <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
            </div>
            <div>
              <p class="stat-card-label" style="font-size: 9px; line-height: 12px; margin-bottom: 0;">绩效</p>
              <p class="stat-card-value" id="popupPerfCount" style="font-size: 13px; line-height: 16px;">0</p>
            </div>
          </div>
        </div>
        <button id="openCreatorManageBtn" class="px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200 whitespace-nowrap" style="padding: 4px 13px; line-height: 1.2; text-align: center; min-height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px;">
          达人<br>管理
        </button>
      </div>
      <!-- Search Input -->
      <div class="mb-5 relative">
        <input id="creatorSearchInput" type="text" class="w-full bg-fluent-input border-t-0 border-l-0 border-r-0 border-b border-fluent-inputBorder rounded-md px-3 py-2 text-sm text-fluent-text placeholder-fluent-textMuted fluent-input transition-colors duration-200" placeholder="通过达人ID，CID，地区搜索..."/>
      </div>
      <div id="creatorPreview"></div>
      <div id="creatorSearchResults" class="search-results">
        <div id="searchResultLabel" class="text-sm text-fluent-textMuted mb-2" style="display:none;">搜索结果：</div>
        <div id="creatorSearchList" class="search-list"></div>
      </div>
    </section>
    <!-- END: Creator Management Section -->

    <!-- BEGIN: Function Selection Section -->
    <section id="toolsCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-4 backdrop-blur-md shadow-lg flex flex-col items-center">
      <h3 class="text-sm text-fluent-textMuted mb-4">选择要使用的功能</h3>
      <!-- Buttons Grid -->
      <div class="grid grid-cols-2 gap-3 w-full">
        <button id="btnCover" class="flex items-center justify-center gap-2 px-4 py-2 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
          获取视频封面
        </button>
        <button id="btnCid" class="flex items-center justify-center gap-2 px-4 py-2 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
          获取头像/CID
        </button>
        <button id="btnCidToName" class="flex items-center justify-center gap-2 px-4 py-2 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
          CID获取达人
        </button>
        <button id="btnOrder" class="flex items-center justify-center gap-2 px-4 py-2 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
          订单履约情况
        </button>
      </div>
    </section>
    <!-- END: Function Selection Section -->

    <!-- BEGIN: AI Translation Section -->
    <section id="translateCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-4 backdrop-blur-md shadow-lg">
      <div class="flex items-baseline gap-2 mb-3">
        <h3 class="text-sm font-semibold">AI翻译</h3>
        <span id="translateModelInfo" class="text-xs text-fluent-textMuted">未配置</span>
      </div>
      <div class="flex gap-3 w-full">
        <button id="btnTranslateNow" class="flex-1 flex items-center justify-center gap-2 px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
          即时翻译
        </button>
        <button id="btnTranslate" class="flex-1 flex items-center justify-center gap-2 px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
          翻译配置
        </button>
      </div>
    </section>
    <!-- END: AI Translation Section -->

    <!-- BEGIN: Phrase Management Section -->
    <section id="phraseCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-4 backdrop-blur-md shadow-lg">
      <div id="phraseCardStatus" class="status info" style="display:none;"></div>
      <div class="flex items-baseline gap-2 mb-4">
        <h3 class="text-sm font-semibold">短语管理</h3>
        <span id="phraseShortcutHint" class="text-xs text-fluent-textMuted">快捷短语输入"/"触发</span>
      </div>
      <div id="tagBar" class="tagbar mt-3"></div>
      <div id="phraseList" style="display:none;"></div>
    </section>
    <!-- END: Phrase Management Section -->

    <!-- BEGIN: Data Management Section -->
    <section id="dataCard" class="bg-fluent-panel border border-fluent-border rounded-xl p-4 backdrop-blur-md shadow-lg">
      <div id="dataCardStatus" class="status info" style="display:none;"></div>
      <div class="flex items-baseline gap-2 mb-4">
        <h3 class="text-sm font-semibold">数据管理</h3>
        <span class="text-xs text-fluent-textMuted">备份与恢复数据</span>
      </div>
      <button id="btnBackup" class="px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200">
        数据备份
      </button>
    </section>
    <!-- END: Data Management Section -->
  </main>

  <div id="phraseEditDialog" class="dialog-mask">
    <div class="dialog">
      <h3 id="phraseEditTitle">添加短语</h3>
      <label for="phraseTag">标签（必选）</label>
      <select id="phraseTag"></select>
      <label for="phraseTitle">标题</label>
      <input id="phraseTitle" type="text" placeholder="例如：常用回复"/>
      <label for="phraseContent">内容</label>
      <textarea id="phraseContent" placeholder="输入要插入的文本"></textarea>
      <div class="footer">
        <button id="cancelPhraseBtn" class="btn-sm">取消</button>
        <button id="savePhraseBtn" class="btn-sm btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="creatorEditDialog" class="dialog-mask">
    <div class="dialog">
      <h3>编辑达人信息</h3>
      <label for="creatorEditId">达人ID</label>
      <input id="creatorEditId" type="text" readonly/>
      <label for="creatorEditCid">达人CID（选填）</label>
      <input id="creatorEditCid" type="text" placeholder="输入达人CID"/>
      <label for="creatorEditRegion">地区代码（选填）</label>
      <input id="creatorEditRegion" type="text" placeholder="例如：MY/TH/ID/SG/PH/VN"/>
      <label for="creatorEditTag">标签（选填）</label>
      <input id="creatorEditTag" type="text" placeholder="例如：绩效达人、流失达人、隐藏达人"/>
      <label for="creatorEditRemark">备注信息（选填）</label>
      <textarea id="creatorEditRemark" placeholder="输入达人的备注信息" style="min-height: 60px;"></textarea>
      <div class="footer">
        <button id="cancelCreatorEditBtn" class="btn-sm">取消</button>
        <button id="saveCreatorEditBtn" class="btn-sm btn-primary">保存</button>
        <button id="deleteCreatorBtn" class="btn-sm" style="color: var(--fluent-statPerfText); border-color: rgba(255,100,100,0.3);">删除</button>
      </div>
    </div>
  </div>

  <script src="libs/exceljs.min.js"></script>
  <script src="phrase/phrase.js"></script>
  <script src="creator/creator.js"></script>
  <script src="popup.js"></script>

  <div class="footer-text">
    Powered by "电子恐龙" with AI
  </div>
</body>
</html>
