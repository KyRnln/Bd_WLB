<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人管理</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/modules.css">
  <style>
    body.page-creator {
      width: 100%;
      max-width: 100%;
      margin: 0;
      background: var(--background);
    }
    body.page-creator svg.h-5.w-5 {
      max-height: 20px;
      width: auto;
    }
    body.page-creator .toolbar-search {
      display: flex;
      align-items: center;
      margin-right: 0;
      width: auto;
    }
    body.page-creator .search-box {
      display: flex;
      align-items: center;
      margin-bottom: 0;
    }
    body.page-creator .search-box-input {
      padding: 6px 12px 6px 36px;
      line-height: 20px;
    }
  </style>
</head>
<body class="page-creator">
  <main class="creator-main">
    <!-- Page Header -->
    <div class="creator-header">
      <div class="creator-header-top">
        <span class="creator-header-icon">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
        </span>
        <h1 class="creator-title">达人管理</h1>
        <div id="creatorCardStatus" class="status info" style="display:none; margin-left: auto; width: auto; margin-bottom: 0;"></div>
      </div>
      <p class="creator-subtitle">查看和管理所有达人信息，支持搜索、编辑和删除。</p>
    </div>

    <!-- Stats Row -->
    <div class="creator-stats-row" id="creatorStatsRow">
      <div class="fluent-card stat-card">
        <div class="stat-icon stat-icon-total">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
        </div>
        <div>
          <p class="stat-card-label">达人总计</p>
          <p class="stat-card-value" id="totalCount">0</p>
        </div>
      </div>
      <div class="fluent-card stat-card">
        <div class="stat-icon stat-icon-perf">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
        </div>
        <div>
          <p class="stat-card-label">绩效达人</p>
          <p class="stat-card-value" id="perfCount">0</p>
        </div>
      </div>
      <div class="fluent-card stat-card">
        <div class="stat-icon stat-icon-perf">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
        </div>
        <div>
          <p class="stat-card-label">复联达人</p>
          <p class="stat-card-value" id="reconnectCount">0</p>
        </div>
      </div>
      <div class="fluent-card stat-card">
        <div class="stat-icon stat-icon-lost">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6L9 12.75l4.286-4.286a11.948 11.948 0 014.306 6.43l.776 2.898m0 0l3.182-5.511m-3.182 5.51l-5.511-3.181" /></svg>
        </div>
        <div>
          <p class="stat-card-label">已流失</p>
          <p class="stat-card-value" id="lostCount">0</p>
        </div>
      </div>
    </div>

    <!-- Action Toolbar -->
    <div class="fluent-card creator-toolbar">
      <div class="toolbar-buttons">
        <button id="importFeishuBtn" class="toolbar-btn toolbar-btn-primary">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
          从飞书导入
        </button>
        <button id="configFeishuBtn" class="toolbar-btn toolbar-btn-secondary">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" /></svg>
          飞书数据源配置
        </button>
        <button id="importHiddenBtn" class="toolbar-btn toolbar-btn-primary">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
          导入隐藏达人
        </button>
        <button id="configHiddenBtn" class="toolbar-btn toolbar-btn-secondary">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          隐藏达人配置
        </button>
      </div>
      <div class="toolbar-search">
        <div class="search-box">
          <svg class="h-4 w-4 search-box-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
          <input id="creatorSearchInput" type="text" class="search-box-input" placeholder="通过 ID、CID、地区搜索..." />
        </div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="creator-filters" id="creatorTagBar">
      <button class="filter-tab active" data-id="all">全部</button>
    </div>

    <!-- Progress Bar -->
    <div id="importProgressBar" class="progress-bar" style="display: none;">
      <div class="progress-track">
        <div id="importProgressFill" class="progress-fill" style="width: 0%;"></div>
      </div>
      <span id="importProgressText" class="progress-text">0%</span>
    </div>

    <!-- Creator Grid -->
    <div id="creatorList" class="creator-grid"></div>
  </main>

  <!-- Edit Dialog -->
  <div id="creatorEditDialog" class="dialog-mask">
    <div class="dialog">
      <h3>编辑达人信息</h3>
      <label for="creatorEditId">达人ID</label>
      <input id="creatorEditId" type="text" readonly />
      <label for="creatorEditCid">达人CID（选填）</label>
      <input id="creatorEditCid" type="text" placeholder="输入达人CID" />
      <label for="creatorEditRegion">地区代码（选填）</label>
      <select id="creatorEditRegion">
        <option value="">请选择地区</option>
      </select>
      <label for="creatorEditTag">标签（选填）</label>
      <input id="creatorEditTag" type="text" placeholder="输入标签名称" />
      <label for="creatorEditRemark">备注信息（选填）</label>
      <textarea id="creatorEditRemark" placeholder="输入达人的备注信息" style="min-height: 60px;"></textarea>
      <div class="footer">
        <button id="cancelCreatorEditBtn" class="btn-sm">取消</button>
        <button id="saveCreatorEditBtn" class="btn-sm btn-primary">保存</button>
        <button id="deleteCreatorBtn" class="btn-sm" style="color: var(--stat-perf-text); border-color: rgba(255, 100, 100, 0.3);">删除</button>
      </div>
    </div>
  </div>

  <!-- Feishu Config Dialog -->
  <div id="feishuConfigDialog" class="dialog-mask">
    <div class="dialog" style="max-width: 560px; max-height: 80vh; overflow-y: auto;">
      <h3>飞书数据源配置</h3>
      <p style="font-size: 13px; color: var(--text-muted, #888); margin-bottom: 16px; line-height: 1.5;">
        配置飞书多维表格数据源，支持多个数据源，每个数据源可设置备注名称。
      </p>
      <div id="dialogPanelContainer">
        <p style="text-align: center; color: var(--text-muted, #888); padding: 24px 0;" id="noDataSourceHint">
          暂无数据源，点击下方「添加数据源」按钮添加
        </p>
      </div>
      <button id="dialogAddDataSourceBtn" class="btn-sm btn-primary" style="display: flex; align-items: center; gap: 4px; width: 100%; justify-content: center; margin-top: 12px;">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        添加数据源
      </button>
      <div class="footer" style="margin-top: 18px;">
        <button id="closeFeishuConfigBtn" class="btn-sm">关闭</button>
      </div>
    </div>
  </div>

  <!-- Data Source Panel Template (hidden, used by JS) -->
  <template id="dataSourcePanelTemplate">
    <details class="panel" style="margin-bottom: 12px;">
      <summary class="custom-summary" style="cursor: pointer; padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 8px;">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" /></svg>
        <span style="flex: 1;" class="panel-remark">数据源</span>
        <svg class="chevron-icon h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
      </summary>
      <div class="panel-content" style="padding: 12px 0; overflow: hidden;">
        <p style="font-size: 13px; color: var(--text-muted, #888); margin-bottom: 16px; line-height: 1.5;">
          配置飞书多维表格信息，通过字段名匹配导入达人数据：<br>
          <strong>达人名称字段</strong>：用于匹配达人ID<br>
          <strong>达人CID字段</strong>：用于匹配达人CID<br>
          其他字段（地区、标签、备注）将自动导入
        </p>
        <label>备注名称</label>
        <input type="text" class="ds-field ds-remark" placeholder="输入数据源备注名称" />
        <label>App ID</label>
        <input type="text" class="ds-field ds-appId" placeholder="cli_xxxxxxxxxxxxx" />
        <label>App Secret</label>
        <input type="password" class="ds-field ds-appSecret" placeholder="输入飞书应用的 App Secret" />
        <label>飞书多维表格 URL</label>
        <input type="text" class="ds-field ds-feishuUrl" placeholder="https://xxx.feishu.cn/base/BASCxxxxx?table=tblxxx" />
        <p style="font-size: 12px; color: var(--text-muted, #888); margin: 8px 0 8px 0;">
          支持多维表格直链（/base/）和 Wiki 链接（/wiki/），系统将自动解析 Base Token 和 Table ID
        </p>
        <label>达人名称字段名</label>
        <input type="text" class="ds-field ds-nameField" placeholder="达人名称" value="达人名称" />
        <label>达人CID字段名</label>
        <input type="text" class="ds-field ds-cidField" placeholder="达人CID" value="达人CID" />
        <label>达人状态字段名（作为标签）</label>
        <input type="text" class="ds-field ds-statusField" placeholder="达人状态" value="达人状态" />
        <label>地区代码</label>
        <select class="ds-field ds-regionCode">
          <option value="">请选择地区</option>
          <option value="MY">MY</option>
          <option value="SG">SG</option>
          <option value="TH">TH</option>
          <option value="PH">PH</option>
        </select>
        <div class="flex gap-3 mt-3 w-full" style="min-width: 0; gap: 8px;">
          <button class="btn-sm btn-primary ds-import-btn" style="flex:1;">导入数据</button>
          <button class="btn-sm ds-save-btn">保存配置</button>
          <button class="btn-sm ds-delete-btn" style="color: var(--stat-perf-text); border-color: rgba(255, 100, 100, 0.3);">删除</button>
        </div>
      </div>
    </details>
  </template>

  <!-- Hidden Creator Config Dialog -->
  <div id="hiddenConfigDialog" class="dialog-mask">
    <div class="dialog" style="max-width: 520px;">
      <h3>隐藏达人配置</h3>
      <p style="font-size: 13px; color: var(--text-muted, #888); margin-bottom: 16px; line-height: 1.5;">
        配置隐藏达人的飞书多维表格数据源，通过字段名匹配导入达人数据。
      </p>
      <div id="hiddenConfigForm">
        <label>备注名称</label>
        <input type="text" id="hiddenConfigRemark" class="ds-field" placeholder="隐藏达人" />
        <label>App ID</label>
        <input type="text" id="hiddenConfigAppId" class="ds-field" placeholder="cli_xxxxxxxxxxxxx" />
        <label>App Secret</label>
        <input type="password" id="hiddenConfigAppSecret" class="ds-field" placeholder="输入飞书应用的 App Secret" />
        <label>飞书多维表格 URL</label>
        <input type="text" id="hiddenConfigUrl" class="ds-field" placeholder="https://xxx.feishu.cn/base/BASCxxxxx?table=tblxxx" />
        <p style="font-size: 12px; color: var(--text-muted, #888); margin: 8px 0 8px 0;">
          支持多维表格直链（/base/）和 Wiki 链接（/wiki/），系统将自动解析 Base Token 和 Table ID
        </p>
        <label>达人名称字段名</label>
        <input type="text" id="hiddenConfigNameField" class="ds-field" placeholder="达人名称" value="达人名称" />
        <label>达人CID字段名</label>
        <input type="text" id="hiddenConfigCidField" class="ds-field" placeholder="达人CID" value="达人CID" />
        <label>达人状态字段名（作为标签）</label>
        <input type="text" id="hiddenConfigStatusField" class="ds-field" placeholder="达人状态" value="达人状态" />
      </div>
      <div class="footer" style="margin-top: 18px; display: flex; gap: 8px; justify-content: flex-end;">
        <button id="saveHiddenConfigBtn" class="btn-sm btn-primary">保存配置</button>
        <button id="closeHiddenConfigBtn" class="btn-sm">关闭</button>
      </div>
    </div>
  </div>

  <script src="creator.js"></script>
</body>
</html>
