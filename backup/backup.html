<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据备份与恢复</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/modules.css">
</head>
<body class="page-tool">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1>
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" /></svg>
      数据备份与恢复
    </h1>
  </header>

  <main class="px-5" style="padding-bottom: 10vh;">
    <section class="card content-card">
      <div id="backupStatus" class="panel-status info" style="display:none;"></div>

      <details class="panel" style="margin-bottom: 12px;">
        <summary class="custom-summary" style="cursor: pointer; padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 8px;">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" /></svg>
          <span>WebDAV 云同步</span>
        </summary>
        <div class="panel-content" style="padding: 12px 0; overflow: hidden;">
          <p>通过坚果云等WebDAV服务云端备份与恢复</p>
          <label for="webdavUrl">服务器地址</label>
          <input id="webdavUrl" type="text" placeholder="https://dav.jianguoyun.com/dav/" value="https://dav.jianguoyun.com/dav/" />
          <label for="webdavUsername">账号 (邮箱)</label>
          <input id="webdavUsername" type="text" placeholder="输入WebDAV账号" />
          <label for="webdavPassword">应用密码</label>
          <input id="webdavPassword" type="password" placeholder="输入WebDAV应用密码" />
          <div class="flex gap-3 mt-3 w-full" style="min-width: 0; gap: 8px;">
            <button id="backupToWebdavBtn" class="btn-sm flex-1" style="font-size: 12px; padding: 0 10px; height: 34px;">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
              备份到WebDAV
            </button>
            <button id="restoreFromWebdavBtn" class="btn-sm flex-1" style="font-size: 12px; padding: 0 10px; height: 34px;">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
              从WebDAV恢复
            </button>
          </div>
          <div id="webdavStatus" class="status" style="display:none;"></div>
        </div>
      </details>

      <details class="panel" style="margin-bottom: 12px;">
        <summary class="custom-summary" style="cursor: pointer; padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 8px;">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
          <span>本地备份与恢复</span>
        </summary>
        <div class="panel-content" style="padding: 12px 0; overflow: hidden;">
          <div class="mb-4">
            <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1a1a1a;">导出数据</h4>
            <p>将所有数据导出为JSON文件，方便备份和迁移</p>
            <button id="exportDataBtn" class="btn-sm w-full">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
              导出数据
            </button>
          </div>
          <div style="padding-top: 16px; border-top: 1px solid #e5e7eb;">
            <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1a1a1a;">导入数据</h4>
            <p>从JSON文件导入数据，会覆盖现有数据</p>
            <input id="importDataFile" type="file" accept=".json" style="margin-bottom: 8px;" />
            <button id="importDataBtn" class="btn-sm w-full">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
              导入数据
            </button>
          </div>
        </div>
      </details>

      <div class="action-cards mt-4">
        <div class="action-card" style="padding: 16px; background: #fef2f2; border: 1px solid rgba(186, 26, 26, 0.2); border-radius: 16px;">
          <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #ba1a1a;">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="display:inline;vertical-align:middle;margin-right:4px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
            危险操作
          </h4>
          <div class="flex gap-3 w-full" style="min-width: 0; gap: 8px;">
            <button id="initAppBtn" class="btn-sm flex-1" style="font-size: 12px; padding: 0 10px; height: 34px;">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
              初始化应用
            </button>
            <button id="clearAllDataBtn" class="btn-sm flex-1" style="background: #93000a; color: #fff; border-color: #93000a; font-size: 12px; padding: 0 10px; height: 34px;">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
              清除全部数据
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="backup.js"></script>
</body>
</html>
