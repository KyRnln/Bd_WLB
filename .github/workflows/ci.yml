name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Syntax check JavaScript
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './libs/*' -not -path './.git/*' -print0 |
          while IFS= read -r -d '' f; do
            if grep -qE '^[[:space:]]*(import|export)[[:space:]]' "$f"; then
              cp "$f" /tmp/module_check.mjs
              node --check /tmp/module_check.mjs
            else
              node --check "$f"
            fi
            echo "OK: $f"
          done
