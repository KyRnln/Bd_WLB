<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短语管理</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/modules.css">
</head>
<body class="page-phrase">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1>
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" /></svg>
      短语管理
    </h1>
  </header>

  <main class="px-5" style="padding: 10vh 20px;">
    <div id="phraseManageStatus" class="status info" style="display:none;"></div>
    <p class="description">管理快捷短语，用于快速输入常用文本</p>

    <div class="card-actions" style="margin-bottom: 16px; display: flex; gap: 12px; width: 100%;">
      <button id="addPhraseBtn" class="flex-1 px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200" style="background: #1660c1; color: #fff; border-color: #1660c1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        添加短语
      </button>
      <button id="importPhraseBtn" class="flex-1 px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" /></svg>
        导入
      </button>
      <button id="exportPhraseBtn" class="flex-1 px-4 py-1.5 bg-fluent-button hover:bg-fluent-buttonHover border border-fluent-border rounded-md text-sm transition-colors duration-200" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
        导出
      </button>
      <input id="phraseFileInput" type="file" accept=".json" style="display:none;" />
    </div>

    <div class="tagbar" id="phraseTagBar"></div>

    <div id="phraseList" class="phrase-list"></div>
  </main>

  <div id="phraseEditDialog" class="dialog-mask">
    <div class="dialog">
      <h3 id="phraseEditTitle">添加短语</h3>
      <label for="phraseTag">标签（必选）</label>
      <select id="phraseTag">
        <option value="reply">回复</option>
        <option value="greeting">招呼</option>
        <option value="custom">自定义</option>
      </select>
      <label for="phraseTitle">标题</label>
      <input id="phraseTitle" type="text" placeholder="例如：常用回复" />
      <label for="phraseContent">内容</label>
      <textarea id="phraseContent" placeholder="输入要插入的文本" rows="4"></textarea>
      <div class="footer">
        <button id="cancelPhraseBtn" class="btn-sm">取消</button>
        <button id="savePhraseBtn" class="btn-sm btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="tagManageDialog" class="dialog-mask">
    <div class="dialog">
      <h3>标签管理</h3>
      <button id="addTagBtn" class="btn-sm btn-primary" style="margin-bottom: 16px;">+ 添加标签</button>
      <div id="tagListManage"></div>
      <div class="footer">
        <button id="closeTagManageBtn" class="btn-sm">关闭</button>
      </div>
    </div>
  </div>

  <script src="phrase_manage.js"></script>
</body>
</html>
