<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单履约情况</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/utilities.css">
  <link rel="stylesheet" href="../styles/modules.css">
</head>
<body class="page-tool">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1>
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>
      订单履约情况
    </h1>
  </header>

  <main class="px-5" style="padding-bottom: 10vh;">
    <section class="card content-card">
      <div id="orderPanelStatus" class="panel-status info" style="display:none;"></div>
      <p class="description">批量查询TikTok订单的履约情况并导出XLSX</p>

      <div id="orderProgressBar" class="progress-bar" style="display:none;">
        <div class="progress-track" style="position: relative; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden;">
          <div id="orderProgressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="orderProgressText" class="progress-text" style="display: block; text-align: center; margin-top: 6px; font-size: 12px; color: #6b7280;">0/0</span>
      </div>

      <div class="input-area" id="inputArea">
        <textarea id="orderIdInput"
          placeholder="输入批量订单号，每行一个&#10;例如：&#10;2023123456789012345&#10;2023123456789012346" rows="8"></textarea>
      </div>

      <div class="form-group">
        <label for="orderRegion">地区:</label>
        <select id="orderRegion">
          <option value="MY">马来西亚 (MY)</option>
          <option value="SG">新加坡 (SG)</option>
          <option value="TH">泰国 (TH)</option>
          <option value="VN">越南 (VN)</option>
          <option value="PH">菲律宾 (PH)</option>
          <option value="ID">印尼 (ID)</option>
        </select>
      </div>

      <div class="button-group">
        <button class="btn-sm btn-primary flex-1" id="startOrderQueryBtn">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          批量查询
        </button>
        <button class="btn-sm flex-1" id="orderExportBtn" style="display:none;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          导出XLSX
        </button>
        <button class="btn-sm flex-1" id="stopOrderQueryBtn" style="display:none; background: #93000a; color: #fff; border-color: #93000a;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 9.563c0-.31.284-.563.633-.563h.734c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564zM12.633 9.563c0-.31.284-.563.634-.563h.733c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564z" /></svg>
          停止
        </button>
        <button class="btn-sm flex-1" id="orderClearBtn" style="background: #93000a; color: #fff; border-color: #93000a;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          清空
        </button>
      </div>

      <div id="progressDisplay" class="progress-text" style="display: none;"></div>

      <div id="orderResults" class="results"></div>
    </section>
  </main>

  <script src="../libs/exceljs.min.js"></script>
  <script src="order.js"></script>
</body>
</html>
