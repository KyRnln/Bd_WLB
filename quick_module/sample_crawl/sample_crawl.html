<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>样品申请采集</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/utilities.css">
  <link rel="stylesheet" href="../../styles/modules.css">
  <style>
    .log-entry { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f3f4f6; }
    .log-entry .time { color: #9ca3af; margin-right: 8px; }
    .log-entry .msg { color: #374151; }
    .log-entry.error .msg { color: #dc2626; }
    .log-entry.success .msg { color: #059669; }
  </style>
</head>
<body class="page-tool">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1>
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
      样品申请采集
    </h1>
  </header>

  <main class="px-5" style="padding-bottom: 10vh;">
    <section class="card content-card">
      <div id="samplePanelStatus" class="panel-status info" style="display:none;"></div>
      <p class="description">自动采集样品申请页面的所有达人申请数据，上传到飞书多维表格</p>

      <!-- Feishu Config -->
      <details class="panel" style="margin-bottom: 12px;">
        <summary class="custom-summary" style="cursor: pointer; padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 8px;">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          <span style="flex:1;">飞书多维表格配置</span>
          <span id="feishuStatus" class="text-xs" style="color:#ba1a1a;font-weight:400;">未配置</span>
          <svg class="chevron-icon h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </summary>
        <div class="panel-content" style="padding: 12px 0; overflow: hidden;">
          <div style="margin-bottom:8px;">
            <label for="feishuUrl">多维表格链接（自动解析 Base Token 和 Table ID）</label>
            <div style="display:flex;gap:6px;">
              <input id="feishuUrl" type="text" placeholder="https://xxx.feishu.cn/base/BASCxxx?table=tblxxx 或 https://xxx.feishu.cn/wiki/xxx?table=tblxxx" style="flex:1;" />
              <button id="parseUrlBtn" class="btn-sm" style="white-space:nowrap;">解析</button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;">
            <div>
              <label for="feishuAppId">App ID</label>
              <input id="feishuAppId" type="text" placeholder="cli_xxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="feishuAppSecret">App Secret</label>
              <input id="feishuAppSecret" type="password" />
            </div>
            <div>
              <label for="baseToken">Base Token</label>
              <input id="baseToken" type="text" placeholder="BASCxxxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="tableId">Table ID</label>
              <input id="tableId" type="text" placeholder="tblxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="creatorNameField">达人ID字段名</label>
              <input id="creatorNameField" type="text" value="达人ID" />
            </div>
            <div>
              <label for="creatorIdField">达人CID字段名</label>
              <input id="creatorIdField" type="text" value="达人CID" />
            </div>
            <div>
              <label for="productIdField">商品ID字段名</label>
              <input id="productIdField" type="text" value="商品ID" />
            </div>
          </div>
        </div>
      </details>

      <!-- Stats -->
      <div id="sampleStatsRow" class="stats-row" style="display:none;">
        <div class="stat" id="sampleStatTotal">页数: <strong>0</strong></div>
        <div class="stat" style="color: #005faa;">采集: <strong id="sampleStatCollected">0</strong></div>
        <div class="stat" style="color: #137333;">总计: <strong id="sampleStatAll">0</strong></div>
      </div>

      <div id="sampleMultiStats" class="stats-row" style="justify-content: center; display:none;">
        <div class="stat" style="color: #974700;">多商品达人: <strong id="sampleStatMulti">0</strong></div>
      </div>

      <!-- Progress -->
      <div id="sampleProgressBar" class="progress-bar" style="display:none;">
        <div class="progress-track" style="position: relative; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden;">
          <div id="sampleProgressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="sampleProgressText" class="progress-text" style="display: block; text-align: center; margin-top: 6px; font-size: 12px; color: #6b7280;">0/0</span>
      </div>

      <div class="input-area">
        <div class="description" style="font-size: 13px; color: #6b7280; margin-bottom: 12px; text-align: center;">
          操作步骤：<br>
          1. 先在上方配置飞书多维表格信息<br>
          2. 在 TikTok 联盟后台打开 <strong>样品申请</strong> 页面<br>
          3. 点击下方「开始采集」按钮<br>
          4. 扩展将自动翻页采集所有达人申请数据<br>
          5. 完成后自动上传到飞书多维表格并清理数据
        </div>
      </div>

      <div class="button-group">
        <button class="btn-sm flex-1" id="startSampleCrawlBtn">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h14.25M3 9h9.75M3 13.5h5.25m5.25-.75L17.25 9m0 0L21 12.75M17.25 9v12" /></svg>
          开始采集
        </button>
        <button class="btn-sm flex-1" id="stopSampleCrawlBtn" style="display:none;color:#dc2626;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 9.563c0-.31.284-.563.633-.563h.734c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564zM12.633 9.563c0-.31.284-.563.634-.563h.733c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564z" /></svg>
          停止
        </button>
        <button class="btn-sm flex-1" id="clearSampleCrawlBtn" style="color:#dc2626;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          清空
        </button>
      </div>

      <!-- Log -->
      <div id="logPanel" class="card" style="padding:12px;margin-top:16px;max-height:250px;overflow-y:auto;display:none;">
        <div id="logList"></div>
      </div>

      <div id="sampleResults" class="results" style="display:none;">
        <div id="sampleResultSummary" class="result-summary" style="padding: 12px; background: #f0f4ff; border-radius: 8px; margin-top: 16px;"></div>
      </div>
    </section>
  </main>

  <script src="sample_crawl.js"></script>
</body>
</html>
