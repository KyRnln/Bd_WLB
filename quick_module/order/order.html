<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单履约情况</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/utilities.css">
  <link rel="stylesheet" href="../../styles/modules.css">
  <style>
    .log-entry { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f3f4f6; }
    .log-entry .time { color: #9ca3af; margin-right: 8px; }
    .log-entry .msg { color: #374151; }
    .log-entry.error .msg { color: #dc2626; }
    .log-entry.success .msg { color: #059669; }
    .log-entry.info .msg { color: #2563eb; }
    .panel-status { background: #e8f5e9; }
  </style>
</head>

<body class="page-tool">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
        <path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
    <h1>订单履约查询</h1>
  </header>

  <main class="px-5" style="padding: 4px 12px;">
    <section class="card content-card">
      <div id="orderPanelStatus" class="panel-status info" style="display:none;"></div>

      <div id="orderResults" class="results" style="display: none;">
        <div id="orderResultSummary" style="padding: 12px; background: #f0f4ff; border-radius: 8px; margin-top: 16px;"></div>
      </div>

      <!-- Feishu Config -->
      <details class="panel card content-card" style="margin-bottom: 8px;">
        <summary class="custom-summary card-header" style="cursor: pointer; padding: 8px 12px; list-style: none; display: flex; align-items: center; gap: 8px;">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          <span style="flex:1;">飞书多维表格配置</span>
          <span id="feishuStatus" class="text-xs" style="color:#ba1a1a;font-weight:400;">未配置</span>
          <svg class="chevron-icon h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </summary>
        <div class="panel-content" style="padding: 8px 12px;">
          <div class="panel-content-wrap">
          <div style="margin-bottom:4px;">
            <label for="feishuUrl">多维表格链接（自动解析 Base Token 和 Table ID）</label>
            <div style="display:flex;gap:6px;">
              <input id="feishuUrl" type="text" placeholder="https://xxx.feishu.cn/base/BASCxxx?table=tblxxx 或 https://xxx.feishu.cn/wiki/xxx?table=tblxxx" style="flex:1;" />
              <button id="parseUrlBtn" class="btn-sm" style="white-space:nowrap;">解析</button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;">
            <div>
              <label for="feishuAppId">App ID</label>
              <input id="feishuAppId" type="text" placeholder="cli_xxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="feishuAppSecret">App Secret</label>
              <input id="feishuAppSecret" type="password" />
            </div>
            <div>
              <label for="baseToken">Base Token</label>
              <input id="baseToken" type="text" placeholder="BASCxxxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="tableId">Table ID</label>
              <input id="tableId" type="text" placeholder="tblxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="creatorNameField">达人ID字段名（用于TikTok搜索）</label>
              <input id="creatorNameField" type="text" value="达人ID" />
            </div>
            <div>
              <label for="creatorCidField">达人CID字段名</label>
              <input id="creatorCidField" type="text" value="达人CID" />
            </div>
            <div>
              <label for="productIdField">产品ID字段名</label>
              <input id="productIdField" type="text" value="产品ID" />
            </div>
            <div>
              <label for="fulfillmentStatusField">履约状态字段名</label>
              <input id="fulfillmentStatusField" type="text" value="履约状态" />
            </div>
            <div>
              <label for="orderNumberField">订单号字段名</label>
              <input id="orderNumberField" type="text" value="订单号" />
            </div>
          </div>
          </div>
        </div>
      </details>

      <!-- Stats -->
      <div id="orderStatsRow" class="stats-row" style="display:none;">
        <div class="stat" id="statFeishuTotal">飞书记录: <strong>0</strong></div>
        <div class="stat" style="color: #005faa;">待处理: <strong id="statPending">0</strong></div>
        <div class="stat" style="color: #137333;">已匹配: <strong id="statMatched">0</strong></div>
        <div class="stat" style="color: #ba1a1a;">未匹配: <strong id="statUnmatched">0</strong></div>
      </div>

      <!-- Progress -->
      <div id="orderProgressBar" class="progress-bar" style="display:none;">
        <div class="progress-track"
          style="position: relative; height: 6px; background: #e5e7eb; border-radius: 8px; overflow: hidden;">
          <div id="orderProgressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="orderProgressText" class="progress-text"
          style="display: block; text-align: center; margin-top: 6px; font-size: 12px; color: #6b7280;"></span>
      </div>

      <!-- Log -->
      <div id="logPanel" class="card" style="padding:12px;margin-top:16px;max-height:250px;overflow-y:auto;display:none;">
        <div id="logList"></div>
      </div>

      <div class="description" style="font-size: 13px; color: #374151; margin: 16px 0 12px; padding: 12px 16px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; text-align: left; line-height: 1.8;">
        <div style="font-weight: 600; color: #166534; margin-bottom: 4px;">操作步骤：</div>
        1. 先在上方配置飞书多维表格信息<br>
        2. 在 TikTok 联盟后台打开 <strong>样品申请</strong> 页面<br>
        3. 点击下方「开始查询」按钮<br>
        4. 扩展将读取飞书表格中履约状态为空的记录，按达人ID搜索并匹配订单数据<br>
        5. 匹配完成后自动回写订单号和履约状态到飞书表格
      </div>

      <div class="button-group">
        <button class="btn-sm flex-1" id="orderStartBtn">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          开始查询
        </button>
        <button class="btn-sm flex-1" id="orderStopBtn" style="display:none;color:#dc2626;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 9.563c0-.31.284-.563.633-.563h.734c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564zM12.633 9.563c0-.31.284-.563.634-.563h.733c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564z" />
          </svg>
          停止
        </button>
        <button class="btn-sm btn-danger flex-1" id="orderClearBtn">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          清空
        </button>
      </div>

    </section>
  </main>

  <script src="../../styles/auto-squircle.js"></script>
  <script src="order.js"></script>
</body>

</html>
