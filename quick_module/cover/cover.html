<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>获取视频封面</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/utilities.css">
  <link rel="stylesheet" href="../../styles/modules.css">
</head>
<body class="page-tool">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1>
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.41a2.25 2.25 0 013.182 0l2.909 2.91m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
      获取视频封面
    </h1>
  </header>

  <main class="px-5" style="padding-bottom: 10vh;">
    <section class="card content-card">
      <div id="coverPanelStatus" class="panel-status info" style="display:none;"></div>
      <p class="description">粘贴TikTok视频链接（每行一个）获取封面并导出XLSX</p>

      <div id="coverProgressBar" class="progress-bar" style="display:none;">
        <div class="progress-track" style="position: relative; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden;">
          <div id="coverProgressFill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <span id="coverProgressText" class="progress-text" style="display: block; text-align: center; margin-top: 6px; font-size: 12px; color: #6b7280;">0/0</span>
      </div>

      <div id="coverStatsRow" class="stats-row" style="justify-content: center;">
        <div class="stat" id="coverStatTotal">总计: <strong>0</strong></div>
        <div class="stat" style="color: #137333;">成功: <strong id="coverStatSuccess">0</strong></div>
        <div class="stat" style="color: #ba1a1a;">失败: <strong id="coverStatError">0</strong></div>
      </div>

      <div class="input-area">
        <textarea id="coverUrlInput"
          placeholder="https://www.tiktok.com/@user/video/123456...&#10;https://www.tiktok.com/@user/video/789012..."
          rows="8"></textarea>
      </div>

      <div class="button-group">
        <button class="btn-sm btn-primary flex-1" id="coverFetchBtn">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          获取封面
        </button>
        <button class="btn-sm flex-1" id="coverExportBtn" style="display:none;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          导出XLSX
        </button>
        <button class="btn-sm flex-1" id="coverClearBtn" style="background: #93000a; color: #fff; border-color: #93000a;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          清空
        </button>
        <button class="btn-sm flex-1" id="coverStopBtn" style="display:none; background: #93000a; color: #fff; border-color: #93000a;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 9.563c0-.31.284-.563.633-.563h.734c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564zM12.633 9.563c0-.31.284-.563.634-.563h.733c.35 0 .633.252.633.563v4.874c0 .31-.284.563-.633.563h-.734c-.35 0-.633-.252-.633-.563V9.564z" /></svg>
          停止
        </button>
      </div>

      <div id="coverResults" class="results"></div>
    </section>
  </main>

  <script src="../../libs/exceljs.min.js"></script>
  <script src="cover.js"></script>
</body>
</html>
