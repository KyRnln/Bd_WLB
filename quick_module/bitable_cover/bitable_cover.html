<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多维表格封面获取</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/utilities.css">
  <link rel="stylesheet" href="../../styles/modules.css">
  <style>
    .log-entry { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f3f4f6; }
    .log-entry .time { color: #9ca3af; margin-right: 8px; }
    .log-entry .msg { color: #374151; }
    .log-entry.error .msg { color: #dc2626; }
    .log-entry.success .msg { color: #059669; }
  </style>
</head>
<body class="page-tool">
  <header class="page-header">
    <button class="back-btn" id="backBtn" aria-label="返回">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <h1>
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.41a2.25 2.25 0 013.182 0l2.909 2.91m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
      多维表格封面获取
    </h1>
  </header>

  <main class="px-5" style="padding-bottom: 10vh;">
    <section class="card content-card">
      <div id="bitableStatus" class="status" style="display:none;"></div>
      <p class="description">从飞书多维表格读取视频链接，自动获取 TikTok 封面并上传回表格</p>

      <!-- Stats -->
      <div id="statsRow" class="stats-row" style="display:none;">
        <div class="stat" id="statTotal">总记录: <strong>0</strong></div>
        <div class="stat" id="statPending">待处理: <strong>0</strong></div>
        <div class="stat" style="color: #137333;" id="statSuccess">成功: <strong>0</strong></div>
        <div class="stat" style="color: #ba1a1a;" id="statError">失败: <strong>0</strong></div>
      </div>

      <!-- Config Section -->
      <details class="panel" style="margin-bottom: 12px;">
        <summary class="custom-summary" style="cursor: pointer; padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 8px;">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          <span style="flex:1;">飞书多维表格配置</span>
          <span id="feishuStatus" class="text-xs" style="color:#ba1a1a;font-weight:400;">未配置</span>
          <svg class="chevron-icon h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </summary>
        <div class="panel-content" style="padding: 12px 0; overflow: hidden;">
          <div style="margin-bottom:8px;">
            <label for="bitableUrl">多维表格链接（自动解析 Base Token 和 Table ID）</label>
            <div style="display:flex;gap:6px;">
              <input id="bitableUrl" type="text" placeholder="https://xxx.feishu.cn/base/BASCxxx?table=tblxxx&view=vewxxx" style="flex:1;" />
              <button id="parseUrlBtn" class="btn-sm" style="white-space:nowrap;">解析</button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;">
            <div>
              <label for="feishuAppId">App ID</label>
              <input id="feishuAppId" type="text" placeholder="cli_xxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="feishuAppSecret">App Secret</label>
              <input id="feishuAppSecret" type="password" />
            </div>
            <div>
              <label for="baseToken">Base Token（自动填入）</label>
              <input id="baseToken" type="text" placeholder="BASCxxxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="tableId">Table ID（自动填入）</label>
              <input id="tableId" type="text" placeholder="tblxxxxxxxxxxxx" />
            </div>
            <div>
              <label for="videoLinkField">视频链接字段名</label>
              <input id="videoLinkField" type="text" value="视频链接" />
            </div>
            <div>
              <label for="coverField">视频封面字段名</label>
              <input id="coverField" type="text" value="视频封面" />
            </div>
          </div>
        </div>
      </details>

      <!-- Progress -->
      <div id="progressBar" class="progress-bar" style="display:none;">
        <div class="progress-track" style="position:relative;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;">
          <div id="progressFill" class="progress-fill" style="width:0%;"></div>
        </div>
        <span id="progressText" class="progress-text" style="display:block;text-align:center;margin-top:6px;font-size:12px;color:#6b7280;">0/0</span>
      </div>

      <!-- Buttons -->
      <div class="button-group" style="margin-bottom:16px;">
        <button id="scanBtn" class="btn-sm flex-1" style="display:inline-flex;align-items:center;gap:6px;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z" /></svg>
          扫描记录
        </button>
        <button id="processBtn" class="btn-sm flex-1" style="display:none;align-items:center;gap:6px;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" /></svg>
          开始处理
        </button>
        <button id="stopBtn" class="btn-sm" style="display:none;color:#dc2626;align-items:center;gap:6px;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 017.5 5.25h9a2.25 2.25 0 012.25 2.25v9a2.25 2.25 0 01-2.25 2.25h-9A2.25 2.25 0 015.25 16.5v-9z" /></svg>
          停止
        </button>
        <button id="clearBtn" class="btn-sm" style="display:inline-flex;align-items:center;gap:6px;color:#dc2626;">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          清空
        </button>
      </div>

      <!-- Log -->
      <div id="logPanel" class="card" style="padding:12px;margin-bottom:16px;max-height:200px;overflow-y:auto;display:none;">
        <div id="logList"></div>
      </div>

    </section>
  </main>

  <script src="bitable_cover.js"></script>
</body>
</html>
